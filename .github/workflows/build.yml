name: Build

# Builds .deb (cargo-bundle), .rpm (cargo-generate-rpm) and a universal .dmg
# (cargo-bundle).
# Every run uploads each package as its own workflow artifact. Pushing a `v*` tag
# also creates a draft GitHub release with them attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Slint's winit backend needs these to build and run on Linux.
  LINUX_DEPS: libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary's glibc
          # requirement is low enough for most distros, Fedora included.
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary needs both architectures.
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install packaging tools
        run: |
          cargo install cargo-bundle --locked --version 0.12.0
          if [ "${{ matrix.name }}" = linux ]; then
            cargo install cargo-generate-rpm --locked --version 0.21.1
          fi

      - name: Build .deb and .rpm
        if: matrix.name == 'linux'
        run: |
          cargo bundle --release --format deb
          # cargo-bundle can't build RPMs yet; this packages the binary built above.
          cargo generate-rpm
      - name: Build universal .dmg
        if: matrix.name == 'macos'
        run: cargo bundle --release --format dmg -t aarch64-apple-darwin -t x86_64-apple-darwin

      - name: Collect packages
        run: |
          mkdir dist
          find target \( -path '*/bundle/*' -o -path '*/generate-rpm/*' \) \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: hm-gui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Home Manager GUI ${{ github.ref_name }}
          body: See the assets below for the .deb, .rpm and .dmg packages.
          draft: true
          files: dist/*
