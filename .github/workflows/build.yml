name: Build

# Builds .deb and .rpm (Linux) and a universal .dmg (macOS).
# Every run uploads each package as its own workflow artifact. Pushing a `v*` tag
# also creates a draft GitHub release with them attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build frontend
        run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary's glibc
          # requirement is low enough for most distros, Fedora included.
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm
            bundle: src-tauri/target/release/bundle
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary needs both architectures.
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only tag pushes create a release; other runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Home Manager GUI ${{ github.ref_name }}
          releaseBody: See the assets below for the .deb, .rpm and .dmg packages.
          releaseDraft: true

      - name: Upload .deb
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: hm-gui-deb
          path: ${{ matrix.bundle }}/deb/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: hm-gui-rpm
          path: ${{ matrix.bundle }}/rpm/*.rpm
          if-no-files-found: error

      - name: Upload .dmg
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: hm-gui-dmg
          path: ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
