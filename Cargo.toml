[package]
name = "hm-gui"
version = "0.1.0"
description = "A desktop GUI for home-manager"
license = "MIT"
authors = ["Adham Salama"]
edition = "2024"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rnix = "0.14.0"
similar = "3.2.0"
anyhow = "1.0.104"
dirs = "7.0.0"
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["process", "io-util", "macros", "time", "fs", "sync", "rt-multi-thread"] }
rowan = "0.16"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# HTTPS for search.nixos.org. rustls (with ring) is compiled in, so there is no
# OpenSSL dependency; ~1.4 MB of binary.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The package index (src/index.rs). Bundled, so there's no system SQLite to match.
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3.27.0"
png = { version = "0.18", optional = true }

[features]
# Debug screenshots via HM_GUI_SNAPSHOT.
snapshot = ["dep:png"]

[build-dependencies]
slint-build = "1.18"


# No cross-crate LTO and the default codegen units: full LTO saved ~2 MB of
# binary but tripled release build times (117 s vs 41 s to rebuild hm-gui).
[profile.release]
lto = false
opt-level = 3
panic = "abort"
strip = true

[package.metadata.bundle]
name = "Home Manager GUI"
identifier = "dev.adham.hmgui"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns"]
category = "Utility"
short_description = "A desktop GUI for home-manager"
deb_depends = ["libfontconfig1", "libxkbcommon0", "libxkbcommon-x11-0"]

# cargo-bundle can't build RPMs yet, so they come from cargo-generate-rpm.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/hm-gui", dest = "/usr/bin/hm-gui", mode = "755" },
    { source = "packaging/hm-gui.desktop", dest = "/usr/share/applications/hm-gui.desktop", mode = "644" },
    { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/hm-gui.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
